services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zero
      POSTGRES_PASSWORD: zero
      POSTGRES_DB: zero_outlet_pos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero -d zero_outlet_pos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
